<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <!-- GLOSSY 3D TROPHY (TEAL & WHITE TONES) - SWAPPABLE ASSET -->
  <defs>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F2F6" />
      <stop offset="40%" stop-color="#5FAAC0" />
      <stop offset="100%" stop-color="#12789C" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CCE4EC" stop-opacity="0.1" />
    </linearGradient>
    <filter id="trophyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0C2342" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#trophyShadow)">
    <!-- Base Plate -->
    <rect x="65" y="152" width="70" height="18" rx="8" fill="#0C2342" />
    <rect x="75" y="142" width="50" height="12" rx="4" fill="#1A3A63" />

    <!-- Stem -->
    <path d="M92 115 L108 115 L104 142 L96 142 Z" fill="url(#trophyGrad)" />

    <!-- Cup Body -->
    <path d="M60 40 C60 85 80 115 100 115 C120 115 140 85 140 40 Z" fill="url(#trophyGrad)" />
    <!-- Cup Rim -->
    <ellipse cx="100" cy="40" rx="40" ry="12" fill="#E6F2F6" />
    <ellipse cx="100" cy="40" rx="36" ry="10" fill="#0E6180" />

    <!-- Cup Highlight -->
    <path d="M68 46 C74 78 88 100 100 106 C88 95 78 75 72 48 Z" fill="url(#goldShine)" />

    <!-- Handles -->
    <path d="M60 52 C35 52 35 88 65 92" stroke="#CCE4EC" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M140 52 C165 52 165 88 135 92" stroke="#CCE4EC" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Star Emblem on Cup -->
    <polygon points="100,60 103,69 112,69 105,74 107,83 100,78 93,83 95,74 88,69 97,69" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
